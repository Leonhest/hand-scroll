<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#17664d"/><stop offset="1" stop-color="#082b20"/>
  </linearGradient>
  <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".62" stop-color="#fff"/><stop offset=".86" stop-color="#000"/>
  </linearGradient>
  <mask id="fade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fadeGrad)"/></mask>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
  </filter>
</defs>
<rect width="1280" height="800" fill="url(#bg)"/>
<text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="640" y="112" text-anchor="middle" fill="#fff" font-size="54" font-weight="700">No camera window. Just scroll.</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="640" y="158" text-anchor="middle" fill="#9fdcc7" font-size="24">Tracking runs invisibly in the background while you read.</text>
<g filter="url(#shadow)"><rect x="150" y="210" width="980" height="540" rx="14" fill="#fbfcfb"/></g>

