<text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="240" y="372" fill="#6b7a74" font-size="16">Serves 4 · 45 minutes</text>
<clipPath id="dish"><rect x="240" y="398" width="330" height="200" rx="12"/></clipPath>
<g clip-path="url(#dish)">
