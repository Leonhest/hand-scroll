<text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="620" y="436" fill="#1c2b26" font-size="20" font-weight="700">Method</text>
<circle cx="632" cy="468" r="12" fill="#e6f3ee"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="632" y="473" text-anchor="middle" fill="#1f7a5e" font-size="13" font-weight="700">1</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="654" y="474" fill="#3b4a45" font-size="17">Brown the mince with onion and garlic.</text>
<circle cx="632" cy="502" r="12" fill="#e6f3ee"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="632" y="507" text-anchor="middle" fill="#1f7a5e" font-size="13" font-weight="700">2</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="654" y="508" fill="#3b4a45" font-size="17">Stir in tomatoes; simmer 15 min.</text>
<circle cx="632" cy="536" r="12" fill="#e6f3ee"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="632" y="541" text-anchor="middle" fill="#1f7a5e" font-size="13" font-weight="700">3</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="654" y="542" fill="#3b4a45" font-size="17">Layer sauce, pasta sheets and béchamel.</text>
<circle cx="632" cy="570" r="12" fill="#e6f3ee"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="632" y="575" text-anchor="middle" fill="#1f7a5e" font-size="13" font-weight="700">4</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="654" y="576" fill="#3b4a45" font-size="17">Top with cheese. Bake 25 min at 190°C.</text>
<circle cx="632" cy="604" r="12" fill="#e6f3ee"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="632" y="609" text-anchor="middle" fill="#1f7a5e" font-size="13" font-weight="700">5</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" x="654" y="610" fill="#3b4a45" font-size="17">Rest 5 minutes before slicing.</text>

<g>
